<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070709" />
    <meta name="description" content="Parallels ranks all of Earth's land as test sites for a Moon south-pole base and for Mars, challenge by challenge, and says honestly how close each match is and where it breaks." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parallels" />
    <meta property="og:title" content="Parallels: Earth's closest parallels to every part of a Moon or Mars base" />
    <meta property="og:description" content="Parallels ranks all of Earth's land as test sites for a Moon south-pole base and for Mars, challenge by challenge, and says honestly how close each match is and where it breaks." />
    <meta property="og:image" content="/logo-180.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Parallels: Earth's closest parallels to every part of a Moon or Mars base" />
    <meta name="twitter:description" content="Parallels ranks all of Earth's land as test sites for a Moon south-pole base and for Mars, challenge by challenge, and says honestly how close each match is and where it breaks." />
    <meta name="twitter:image" content="/logo-180.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <title>Parallels: Earth's closest parallels to every part of a Moon or Mars base</title>
    <style>
      body { margin: 0; background: #070709; color: #f2f0eb; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 10px 20px; border-bottom: 1px solid rgba(244,242,238,.09); background: rgba(10,10,13,.84); box-sizing: border-box; }
      .boot b { display: inline-block; font: 800 23px/1 "Arial Narrow", system-ui, sans-serif; letter-spacing: .04em; }
      .boot-body { display: grid; place-items: center; gap: 18px; min-height: calc(100vh - 62px); min-height: calc(100svh - 62px); padding: 32px 20px; text-align: center; box-sizing: border-box; }
      .boot-inner { display: grid; justify-items: center; gap: 16px; max-width: 42ch; }
      .boot-mark { width: 52px; height: 52px; animation: boot-pulse 2.2s cubic-bezier(.16,1,.3,1) infinite; }
      .boot-msg { margin: 0; color: #a8a6a0; font-size: 14.5px; }
      @keyframes boot-pulse { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.03); } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; opacity: .9; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><img src="/favicon.svg" width="28" height="28" alt=""><b>PARALLELS</b></div>
      <div class="boot-body">
        <div class="boot-inner">
          <img class="boot-mark" src="/favicon.svg" width="52" height="52" alt="">
          <p class="boot-msg" role="status">Loading Earth's land, cell by cell. On a slow connection this takes a few seconds.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
