<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="Parallels ranks all of Earth's land as test sites for a Moon south-pole base and for Mars, challenge by challenge, and says honestly how close each match is and where it breaks." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo-180.png" />
    <title>Parallels: Earth's closest parallels to every part of a Moon or Mars base</title>
    <style>
      body { margin: 0; background: #050607; color: #eef1f4; font: 15px/1.5 system-ui, sans-serif; }
      .boot { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid rgba(255,255,255,.13); }
      .boot b { display: inline-block; font: 800 19px/1 "Arial Black", system-ui, sans-serif; letter-spacing: .14em; padding: 5px 0 4px; border-top: 1px solid #eef1f4; border-bottom: 1px solid #eef1f4; }
      .boot-msg { padding: 28px 20px; color: #b2bac4; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot"><img src="/favicon.svg" width="28" height="28" alt=""><b>PARALLELS</b></div>
      <p class="boot-msg" role="status">Loading Earth's land, cell by cell. On a slow connection this takes a few seconds.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
